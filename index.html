const cg=c=>c[0]=="D"?0:c[0]=="H"?1:2;
function ck(c){const r=c.slice(1);let m;
 if(m=r.match(/^P([A-Z])$/))return[0,m[1].charCodeAt(0),0];
 if(m=r.match(/^([ABC])(\d)$/))return[1,"CBA".indexOf(m[1]),+m[2]];
 if(m=r.match(/^N(\d)$/))return[2,+m[1],0];
 if(m=r.match(/^S([A-Z])$/))return[3,m[1].charCodeAt(0),0];
 if(m=r.match(/^(\d+)$/))return[4,+m[1],0];
 return[9,0,0]}
const cmpC=(a,b)=>{if(cg(a)!=cg(b))return cg(a)-cg(b);const x=ck(a),y=ck(b);for(let i=0;i<3;i++)if(x[i]!=y[i])return x[i]-y[i];return a.localeCompare(b)};
let GC=[];const GN=["Pupillen","Junioren","Senioren","Overig"],gn=c=>{const k=ck(c)[0];return k==0?0:k==1?1:k==9?3:2};

 const B=G[gew];
 $("dt").innerHTML=D.map(d=>`<button class="${d==afs?"on":""}" data-a="${d}">${d} m</button>`).join("");
 $("rb").innerHTML=["Alle",...B].map(b=>`<option value="${b}" ${b==rbf?"selected":""}>${b=="Alle"?"Alle banen":b}</option>`).join("");
 const AL=[...RS.map(x=>({...x,seed:1}))];
 const cats=[...new Set(AL.filter(x=>x.g==gew&&x.c).map(x=>x.c))].sort(cmpC);
 const gc=[[],[],[],[]];cats.forEach(c=>gc[gn(c)].push(c));GC=gc;
 $("rcl").innerHTML=gc.map((l,g)=>l.length?`<label class="ck" style="grid-column:1/-1;font-weight:600;margin-top:4px"><input type="checkbox" data-g="${g}" ${l.every(c=>cs.has(c))?"checked":""}>${GN[g]}</label>`+l.map(c=>`<label class="ck"><input type="checkbox" data-c="${esc(c)}" ${cs.has(c)?"checked":""}>${esc(c)}</label>`).join(""):"").join("");
 $("rcs").textContent=cs.size?"Categorieën: "+[...cs].join(", "):"Alle categorieën";
 const vers=[...new Set(AL.filter(x=>x.g==gew&&x.v).map(x=>x.v))].sort((a,b)=>a.localeCompare(b));
 $("vl").innerHTML=vers.map(v=>`<label class="ck"><input type="checkbox" data-v="${esc(v)}" ${vf.has(v)?"checked":""}>${esc(v)}</label>`).join("");
 $("vs").textContent=vf.size?"Verenigingen: "+[...vf].join(", "):"Alle verenigingen";
 const best={};
 AL.forEach(x=>{if(x.a!=afs||x.g!=gew||(rbf!="Alle"&&x.b!=rbf)||(cs.size&&!cs.has(x.c))||(vf.size&&!vf.has(x.v)))return;const k=x.n.toLowerCase()+"|"+(x.c||"").toLowerCase();if(!best[k]||x.s<best[k].s)best[k]=x});
 const L=Object.values(best).sort((a,b)=>a.s-b.s);
 $("rl").innerHTML=L.length?L.map((x,j)=>`<div class="w"><div><b>${j+1}.</b> ${esc(x.n)}${x.c?` <span class="e">(${esc(x.c)})</span>`:""}<div class="e">${x.v?esc(x.v)+" · ":""}${x.b}${x.w?" · "+x.w:""}</div></div><div style="display:flex;align-items:center"><b>${ft(x.s)}</b>${x.seed?"":`<button class="x" data-r="${x.i}" aria-label="Verwijderen">✕</button>`}</div></div>`).join(""):`<div class="e">Nog geen tijden op ${afs} m</div>`;
}

// Uitslagen uit data/uitslagen.json (automatisch gevuld vanuit de PDF's)
(async()=>{

 const urls=[own&&rep?`https://raw.githubusercontent.com/${own}/${rep}/main/data/uitslagen.json`:"","data/uitslagen.json"].filter(Boolean);
 for(const u of urls){try{
  const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)continue;
  const db=await r.json(),gw=b=>Object.keys(G).find(k=>G[k].includes(b))||Object.keys(G)[0];
  const done=new Set(db.wedstrijden.map(x=>x.w+"|"+x.b));
  const nieuw=db.wedstrijden.flatMap(x=>x.tijden.map(t=>({n:t.n,c:t.c,v:V[t.n],a:t.a,s:pt(t.t),b:x.b,g:gw(x.b),w:x.w})));
  RS=[...RS.filter(x=>!done.has(x.w+"|"+x.b)),...nieuw.filter(x=>x.s!=null)];
  drawR();return}catch(e){}}
})();
